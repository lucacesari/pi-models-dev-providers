name: Build
defaults:
  run:
    shell: nix develop --command {0}
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: nix
    steps:
      - uses: actions/checkout@v6
      - name: Install dependecies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
