name: Publish
defaults:
  run:
    shell: nix develop --command {0}
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: nix
    steps:
      - uses: actions/checkout@v6
      - name: Install dependecies
        run: pnpm install --frozen-lockfile
      - name: Publish
        env:
          NPM_TOKEN: ${{secrets.NPM_REGISTRY_TOKEN}}
        run: pnpm publish --access public
